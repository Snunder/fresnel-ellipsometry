[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fresnel-ellipsometry"
version = "0.3.0"
description = "Research software for KK-consistent and physical-model inversion of isotropic and uniaxial spectroscopic ellipsometry data."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Research software contributors"}
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "lmfit>=1.2",
  "numba>=0.58",
  "odfpy>=1.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "jupyter>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
